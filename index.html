
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulshan Racing | Car Parking</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071a12;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:20px 10px;background:#0b281b;border-bottom:2px solid #48e09a}
h1{margin:5px;color:#64ffb0;font-size:29px}
p{color:#c1e5d2}
.screen{padding:20px 12px}
.card{max-width:420px;margin:18px auto;padding:22px 14px;background:#103523;border:1px solid #28764e;border-radius:20px;box-shadow:0 0 20px #06140d}
button{border:0;border-radius:12px;background:#24c878;color:#062014;font-size:17px;font-weight:bold;padding:13px 20px;margin:6px;cursor:pointer}
button:active{transform:scale(.96)}
.secondary{background:#244b37;color:white}
.hidden{display:none}
#road{height:390px;max-width:310px;margin:18px auto;background:#414b48;border:4px solid #d7f5e4;border-radius:12px;position:relative;overflow:hidden}
#road:before{content:"";position:absolute;left:50%;top:0;height:100%;border-left:4px dashed #dce8df}
.grass{position:absolute;top:0;height:100%;width:12%;background:#17653d}
.left{left:0}.right{right:0}
#parking{position:absolute;top:40px;left:35%;width:30%;height:62px;border:4px solid #ffe56d;color:#fff4a5;font-size:10px;display:flex;align-items:center;justify-content:center}
#car{position:absolute;left:calc(50% - 19px);bottom:35px;width:38px;height:58px;background:#28d8a0;border:3px solid #d9fff0;border-radius:10px;box-shadow:0 0 12px #24e99c;z-index:2}
#car:before,#car:after{content:"";position:absolute;left:5px;width:22px;height:12px;background:#c9f5ff;border-radius:3px}
#car:before{top:6px}#car:after{bottom:6px}
#message{min-height:24px;color:#8affbd;font-weight:bold}
.controls{max-width:290px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.controls button{padding:13px 0;margin:2px}
footer{padding:20px;color:#91b8a2;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🏁 GULSHAN RACING</h1>
<p>DRIVE • PARK • CONQUER</p>
</header>

<section id="home" class="screen">
<div class="card">
<div style="font-size:70px">🏎️</div>
<h2>CAR PARKING CHALLENGE</h2>
<p>Can you park like a pro?</p>
<p>🌲 Racing Green Edition</p>
<button onclick="startGame()">▶ START GAME</button>
</div>
</section>

<section id="game" class="screen hidden">
<div class="card">
<h2>🚘 Parking Level 1</h2>
<p>Use the arrows to reach the yellow parking box!</p>
<div id="road">
<div class="grass left"></div><div class="grass right"></div>
<div id="parking">PARK HERE</div>
<div id="car"></div>
</div>
<div id="message">Ready, driver?</div>
<div class="controls">
<button class="secondary" onclick="move(-18,0)">⬅️</button>
<button class="secondary" onclick="move(0,-18)">⬆️</button>
<button class="secondary" onclick="move(18,0)">➡️</button>
<button class="secondary" onclick="move(0,18)" style="grid-column:2">⬇️</button>
</div>
<button onclick="restart()">↻ Restart</button>
<button class="secondary" onclick="goHome()">⌂ Home</button>
</div>
</section>

<footer>Made with 💚 by Gulshan Raj</footer>

<script>
let x=0,y=0;
function startGame(){
document.getElementById('home').classList.add('hidden');
document.getElementById('game').classList.remove('hidden');
restart();
}
function move(dx,dy){
const car=document.getElementById('car');
const road=document.getElementById('road');
x=Math.max(-90,Math.min(90,x+dx));
y=Math.max(-135,Math.min(135,y+dy));
car.style.transform=`translate(${x}px,${-y}px)`;
const r=road.getBoundingClientRect();
const c=car.getBoundingClientRect();
const p=document.getElementById('parking').getBoundingClientRect();
if(c.left>p.left && c.right<p.right && c.top>p.top && c.bottom<p.bottom){
document.getElementById('message').textContent='🎉 Perfect Parking! You win!';
}else{
document.getElementById('message').textContent='Keep driving carefully!';
}
}
function restart(){
x=0;y=0;
document.getElementById('car').style.transform='translate(0,0)';
document.getElementById('message').textContent='Reach the yellow parking box!';
}
function goHome(){
document.getElementById('game').classList.add('hidden');
document.getElementById('home').classList.remove('hidden');
}
</script>
</body>
  </html>
